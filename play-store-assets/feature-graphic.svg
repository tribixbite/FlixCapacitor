<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#141414;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>

    <!-- Lightning bolt gradient -->
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e50914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <!-- Phone screen gradient -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGradient)" />

  <!-- Lightning bolt icon (left side) -->
  <g filter="url(#glow)" transform="translate(80, 120)">
    <path d="M 50 0 L 15 85 L 40 85 L 25 160 L 90 70 L 60 70 L 85 0 Z"
          fill="url(#boltGradient)"
          stroke="none"/>
  </g>

  <!-- App name -->
  <text x="200" y="220"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="bold"
        fill="#ffffff"
        letter-spacing="0">FlixCapacitor</text>

  <!-- Tagline -->
  <text x="200" y="280"
        font-family="Arial, Helvetica, sans-serif"
        font-size="36"
        font-weight="500"
        fill="#b3b3b3"
        letter-spacing="0">Stream Instantly</text>

  <!-- Phone mockup (right side) -->
  <g transform="translate(700, 80)">
    <!-- Phone body -->
    <rect x="0" y="0" width="220" height="340" rx="20" ry="20"
          fill="#2a2a2a" stroke="#404040" stroke-width="3"/>

    <!-- Phone screen -->
    <rect x="10" y="40" width="200" height="280" rx="8" ry="8"
          fill="url(#screenGradient)"/>

    <!-- Simulated movie grid (3x2 mini rectangles) -->
    <rect x="20" y="55" width="60" height="80" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="90" y="55" width="60" height="80" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1"/>
    <rect x="160" y="55" width="60" height="80" rx="4" fill="#1a1a1a" stroke="#3b82f6" stroke-width="1"/>

    <rect x="20" y="145" width="60" height="80" rx="4" fill="#1a1a1a" stroke="#e50914" stroke-width="1"/>
    <rect x="90" y="145" width="60" height="80" rx="4" fill="#1a1a1a" stroke="#e50914" stroke-width="1"/>
    <rect x="160" y="145" width="60" height="80" rx="4" fill="#1a1a1a" stroke="#e50914" stroke-width="1"/>

    <!-- Bottom nav bar simulation -->
    <rect x="20" y="245" width="180" height="60" rx="6" fill="#141414"/>
    <circle cx="50" cy="275" r="8" fill="#3b82f6"/>
    <circle cx="110" cy="275" r="8" fill="#666666"/>
    <circle cx="170" cy="275" r="8" fill="#666666"/>
    <circle cx="190" cy="275" r="8" fill="#666666"/>
  </g>

  <!-- Accent light rays -->
  <polygon points="200,150 220,250 240,150" fill="#e50914" opacity="0.05"/>
  <polygon points="500,100 520,250 540,100" fill="#3b82f6" opacity="0.05"/>
</svg>
