name: Feature Request
description: Suggest a new feature or enhancement for FlixCapacitor
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! We appreciate your input to make FlixCapacitor better.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area does this feature relate to?
      options:
        - Torrent Streaming
        - Video Player
        - Library Management
        - Cloud Sync
        - Search & Discovery
        - User Interface
        - Settings & Preferences
        - Performance
        - Accessibility
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: "I'm frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Describe alternatives you've considered
      placeholder: Any alternative solutions or features you've considered

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Are there similar features in other apps you can reference?
      placeholder: Link to screenshots or examples from other apps

  - type: dropdown
    id: willingness
    attributes:
      label: Would you like to contribute?
      description: Are you willing to help implement this feature?
      options:
        - "Yes, I can contribute code"
        - "Yes, I can help with design/testing"
        - "No, but I'd be happy to provide feedback"
        - "No, just suggesting"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here
      placeholder: Any mockups, diagrams, or additional information

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues/feature requests to ensure this is not a duplicate
          required: true
        - label: I have provided a clear description of the feature and its benefits
          required: true
